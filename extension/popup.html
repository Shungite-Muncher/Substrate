<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --ink:#111827; --muted:#5b6474; --line:#e3e6eb; --bg:#f6f7f9; --panel:#fff; --accent:#0f766e; --hi:#b91c1c; --mid:#b45309; --lo:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e6e9ee; --muted:#9aa4b2; --line:#262f3b; --bg:#0d1117; --panel:#151b23; --accent:#2dd4bf; --hi:#f87171; --mid:#fbbf24; --lo:#4ade80; } }
  body { width: 360px; margin: 0; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { display:flex; align-items:center; gap:.5rem; padding:.7rem .9rem; background:var(--panel); border-bottom:1px solid var(--line); font-weight:700; }
  header a { margin-left:auto; font-weight:500; font-size:12px; color:var(--accent); text-decoration:none; }
  form { display:flex; gap:.4rem; padding:.8rem .9rem .4rem; }
  input { flex:1; padding:.5rem .6rem; border:1px solid var(--line); border-radius:7px; background:var(--panel); color:var(--ink); font:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:7px; padding:.5rem .8rem; font-weight:600; cursor:pointer; }
  #out { padding:.4rem .9rem 1rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:.8rem; }
  .mpn { font-family: Consolas, monospace; font-weight:700; font-size:14px; }
  .sub { color:var(--muted); font-size:12px; margin:.1rem 0 .6rem; }
  .scores { display:grid; grid-template-columns:repeat(3,1fr); gap:.4rem; text-align:center; margin-bottom:.6rem; }
  .scores b { display:block; font-size:20px; }
  .scores span { font-size:11px; color:var(--muted); }
  .kv { display:grid; grid-template-columns:1fr 1fr; gap:.3rem .8rem; font-size:12px; margin-bottom:.6rem; }
  .kv span { color:var(--muted); }
  ul { margin:.2rem 0 0; padding-left:1rem; font-size:12px; } li { margin:.2rem 0; }
  .muted { color:var(--muted); font-size:12px; }
  .open { display:block; text-align:center; margin-top:.7rem; color:var(--accent); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
  <header>
    <svg viewBox="0 0 32 32" width="18" height="18"><rect width="32" height="32" rx="7" fill="#0f766e"/><path d="M8 22h16M8 16h16M8 10h16" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>
    Substrate <a href="options.html" target="_blank">Settings</a>
  </header>
  <form id="f"><input id="q" placeholder="Part number, e.g. TPS62130RGTR" autofocus autocomplete="off"><button>Look up</button></form>
  <div id="out"><p class="muted">Tip: select a part number on any page, right-click, then choose <b>Look up in Substrate</b>.</p></div>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
