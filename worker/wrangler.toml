name = "substrate-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Your GitHub Pages URL (no trailing slash)
SITE_URL = "https://shungite-muncher.github.io/Substrate"
# Leave empty to use Google's auto-updating "gemini-flash-lite-latest" alias
GEMINI_MODEL = ""
NEXAR_MONTHLY_PART_BUDGET = "40"

# Free KV namespace that enforces the Nexar monthly budget across all edge locations
# (Nexar's Evaluation allowance is a small lifetime pool, so this cap matters).
[[kv_namespaces]]
binding = "BUDGET"
id = "5b86a7051f604af899c02e5a440ab552"
