name: diag-sia (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          probe() { code=$(curl -sL -o /tmp/out -w "%{http_code}" -A "Mozilla/5.0 (compatible; SubstrateBot/0.1)" --max-time 60 "$1"); echo "$code $(wc -c < /tmp/out) $1"; grep -oE "\\$[0-9.]+ billion (during|in) the month of [A-Za-z]+ 20[0-9]{2}" /tmp/out | head -2; }
          probe "https://r.jina.ai/https://www.semiconductors.org/wp-json/wp/v2/posts?search=semiconductor%20sales&per_page=5&_fields=link,content"
          probe "https://r.jina.ai/https://www.semiconductors.org/year-to-date-global-semiconductor-sales-top-1-trillion-through-august/"
          probe "https://web.archive.org/web/2026id_/https://www.semiconductors.org/feed/"
          probe "https://web.archive.org/web/2026id_/https://www.semiconductors.org/year-to-date-global-semiconductor-sales-top-1-trillion-through-august/"
          curl -s "https://archive.org/wayback/available?url=semiconductors.org/feed/"; echo
