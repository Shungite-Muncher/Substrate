name: diag-mouser (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          MOUSER_API_KEY: ${{ secrets.MOUSER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          key = os.environ["MOUSER_API_KEY"]
          for mpn in ["STM32F407VGT6", "TPS62130RGTR", "NTMFS5C430NLT1G"]:
              body = json.dumps({"SearchByPartRequest": {"mouserPartNumber": mpn, "partSearchOptions": "Exact"}}).encode()
              req = urllib.request.Request("https://api.mouser.com/api/v1/search/partnumber?apiKey=" + key, body, {"Content-Type": "application/json"})
              p = (json.load(urllib.request.urlopen(req, timeout=30)).get("SearchResults") or {}).get("Parts", [{}])[0]
              print("==", mpn, "keys:", sorted(p.keys()))
              print("   compliance:", p.get("ProductCompliance"))
              print("   attrs:", [(a.get("AttributeName"), a.get("AttributeValue")) for a in (p.get("ProductAttributes") or [])][:12])
              print("   info:", p.get("InfoMessages"), "| replacement:", p.get("SuggestedReplacement"))
          PY
