name: diag-mouser (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          MOUSER_API_KEY: ${{ secrets.MOUSER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          key = os.environ["MOUSER_API_KEY"]
          for mpn in ["GRM188R71C104KA01D", "STM32F407VGT6", "LM358DR"]:
              for opt in ["Exact", "None"]:
                  body = json.dumps({"SearchByPartRequest": {"mouserPartNumber": mpn, "partSearchOptions": opt}}).encode()
                  req = urllib.request.Request("https://api.mouser.com/api/v1/search/partnumber?apiKey=" + key, body, {"Content-Type": "application/json"})
                  j = json.load(urllib.request.urlopen(req, timeout=30))
                  parts = (j.get("SearchResults") or {}).get("Parts") or []
                  print("==", mpn, opt, "errors:", j.get("Errors"), "n:", len(parts))
                  for p in parts[:3]:
                      print("   ", {k: p.get(k) for k in ("ManufacturerPartNumber", "MouserPartNumber", "Availability", "AvailabilityInStock",
                                                       "FactoryStock", "LeadTime", "LifecycleStatus", "AvailabilityOnOrder", "Min")})
                      print("    breaks:", (p.get("PriceBreaks") or [])[:3])
          PY
